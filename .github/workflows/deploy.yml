name: Deploy to Google Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME || 'speed-to-lead' }}
  ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO_NAME || 'speed-to-lead' }}

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run test suite
        run: pnpm test

  build-and-deploy:
    name: Build, Push & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation (WIF)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud (supports either WIF or SA Key)
      - name: Authenticate to Google Cloud (Workload Identity)
        if: "${{ secrets.WIF_PROVIDER != '' }}"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key)
        if: "${{ secrets.WIF_PROVIDER == '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Configure Docker authentication for Google Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # 3. Setup Docker Buildx with GitHub Actions layer cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Image Tags
        id: meta
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}"
          echo "image_base=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE_URI}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${IMAGE_URI}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Deploy container to Google Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.meta.outputs.tag_sha }}
          flags: >-
            --allow-unauthenticated
            --cpu-boost
            --concurrency=80
            --min-instances=0
            --max-instances=10
            --timeout=300s
            --set-env-vars=NODE_ENV=production,PORT=8080,CALLE_MODE=mock,CALENDAR_PROVIDER=google,CRM_PROVIDER=local
            --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,CALLE_API_KEY=CALLE_API_KEY:latest

      # 5. Smoke test the newly deployed service endpoint
      - name: Verify Live Health Endpoint
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Service deployed at: ${SERVICE_URL}"
          echo "Running health check against ${SERVICE_URL}/health..."

          HEALTH_RESPONSE=$(curl -f -s --max-time 15 "${SERVICE_URL}/health")
          echo "Health response: ${HEALTH_RESPONSE}"

          if echo "${HEALTH_RESPONSE}" | grep -q '"ok":true'; then
            echo "Health check succeeded!"
          else
            echo "Health check verification failed!"
            exit 1
          fi

      # 6. Publish Summary to GitHub Step Summary
      - name: Publish Deployment Summary
        if: always()
        run: |
          echo "### Google Cloud Run Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Name**: \`${{ env.SERVICE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ env.GCP_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.meta.outputs.tag_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL**: [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint**: [${{ steps.deploy.outputs.url }}/health](${{ steps.deploy.outputs.url }}/health)" >> $GITHUB_STEP_SUMMARY
